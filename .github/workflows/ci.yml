name: CI

# push（main）と全 PR でテストを自動実行する。
# - fast: macOS の `swift test`（純ロジック）。署名不要・高速で、回帰の主検出ライン＝バッジ対象。
# - ios:  iOS シミュレータのパッケージテスト。ランナーの iOS SDK / シミュレータ事情に依存するため
#         best-effort（continue-on-error）。失敗してもワークフロー全体は赤にしない。
on:
  push:
    branches: [main]
  pull_request:

# 最小権限（least privilege）。本ワークフローは checkout してテストを回すだけなので
# 読み取りのみで十分（CodeQL: actions/missing-workflow-permissions 対策）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: macOS unit tests (fast)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run fast tests (swift test)
        run: scripts/test.sh fast

  ios:
    name: iOS simulator tests (best-effort)
    runs-on: macos-15
    continue-on-error: true   # ランナーの iOS 26 SDK / シミュレータ有無に依存するため非ブロッキング
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: List available simulators
        run: xcrun simctl list devices available | sed -n '1,80p'
      - name: Run iOS simulator tests
        # ⚠️ **機種名を固定しない**。ランナーの Xcode が上がると古い機種のデバイスは作られなくなり
        # （Xcode 26 には iPhone 16 Pro が無い）、`name=…` 固定だと
        # 「Unable to find a device matching the provided destination specifier」で
        # **テストが 1 つも走らないまま**ジョブが落ちる（実際にこれで落ちた）。
        # SIM を渡さなければ `scripts/test.sh` がその場で使える iPhone を UDID で選ぶ。
        run: scripts/test.sh ios
